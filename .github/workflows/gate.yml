# ============================================================
# HYC Framework —— CI 闸门
#
# 设计取舍（为什么只有一个 job 而不是 matrix 一把梭）：
#   这个包是 **UPM 包**，不是一个 Unity 工程——它没有 ProjectSettings/，
#   也没有自己的 Library/。要跑 Unity batchmode 就得先造一个壳工程把它当本地包引进去，
#   成本与维护负担都不小，而 Unity 的个人版许可**在公开仓库的 Actions 上拿不到**
#   （Unity 的免费许可绑定桌面激活，不提供 CI 密钥）。
#
#   所以拆成两层：
#     ·gate（本job）—— 纯 bash/python，**不依赖 Unity**，每次push/PR 都跑。
#       它守住的是"静默腐化"那一类问题：文档索引过期、tag 与包版本脱节、
#       新增脚本漏 .meta、菜单英文化约定被破。这些恰恰是 Unity 编译**发现不了**的。
#     · unity-tests（手动触发 / 将来拿到许可后开）—— 真正的编译与 EditMode 测试。
#
# 本地等价命令：bash scripts/verify-gate.sh
# ============================================================

name: Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许手动跑；将来拿到 Unity 许可后由 maintainer 手动触发编译验证
  workflow_dispatch:

jobs:
  gate:
    name: 静态闸门（无需 Unity）
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          # tag 校验需要完整 tag 列表（verify-tag-version.sh 会遍历历史 tag）
          fetch-depth: 0

      - name: 装Python（类型计数用）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行闸门
        run: bash scripts/verify-gate.sh

  # ─────────────────────────────────────────────────────────
  # 真正的 Unity 编译 + EditMode 测试。
  # 默认不启用：需要 UNITY_LICENSE（.ulf，base64 编码）与
  # UNITY_EMAIL / UNITY_PASSWORD / UNITY_SERIAL。
  # 启用步骤见 com.hyc.framework/Documentation~/95-CI与本地验证.md 的「开启 Unity 测试层」。
  # ─────────────────────────────────────────────────────────
  unity-tests:
    name: Unity 编译 + EditMode 测试
    runs-on: ubuntu-latest
    if: false # 拿到 Unity 许可后再改为 true（或删掉本行并在 secrets 配好凭据）
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 还原 Unity 许可
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: echo "$UNITY_LICENSE" | base64 -d > "$HOME/Unity_v2022.x.ulf"

      # 造一个最小壳工程，把本仓库的包以 file: 方式引进去
      - name: 生成测试壳工程
        run: bash ci/make-test-project.sh

      - name: 编译 + 跑 EditMode 测试
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ci/TestProject
          testMode: EditMode
          artifactsPath: test-results
          # 失败时把编辑器日志传上来，否则只有一句"exit code 1"无法定位
          checkName: EditMode Tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}