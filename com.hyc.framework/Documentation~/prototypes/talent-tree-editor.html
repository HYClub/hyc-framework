<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>天赋树编辑器 · 视觉原型</title>
<style>
  :root{
    --chrome:#23232a; --chrome-2:#1b1b21; --panel:#1f1f26;
    --line:#33333d; --line-soft:#2a2a33;
    --canvas:#26262b; --grid:#2f2f37;
    --text:#dcdce4; --text-dim:#8b8b98; --text-faint:#66666f;
    --node:#3a3a42; --node-head:#4a4a55;
    --accent:#7f77dd; --accent-soft:#5b54b5;
    --ok:#1d9e75; --warn:#ef9f27; --err:#e24b4a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:13px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:var(--chrome-2); color:var(--text); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;flex-direction:column;height:100vh}

  /* ---------- 工具栏 ---------- */
  .toolbar{
    height:40px;flex:0 0 40px;background:var(--chrome);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:6px;padding:0 10px;
  }
  .brand{
    font-size:13px;font-weight:500;letter-spacing:.3px;
    margin-right:14px;color:#e8e8f0;
  }
  .brand span{color:var(--text-faint);font-weight:400;margin-left:6px;font-size:12px}
  .tbtn{
    height:26px;padding:0 11px;border-radius:5px;border:1px solid transparent;
    background:transparent;color:var(--text-dim);cursor:pointer;font-size:12px;
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .tbtn:hover{background:#2e2e37;color:var(--text)}
  .tbtn.primary{background:var(--accent-soft);color:#fff}
  .tbtn.primary:hover{background:var(--accent)}
  .sep{width:1px;height:18px;background:var(--line);margin:0 5px}
  .spacer{flex:1}
  .zoom{
    display:flex;align-items:center;gap:2px;background:#2a2a33;
    border:1px solid var(--line);border-radius:5px;height:26px;padding:0 4px;
  }
  .zoom button{
    width:22px;height:20px;border:0;background:transparent;color:var(--text-dim);
    cursor:pointer;border-radius:3px;font-size:14px;line-height:1;
  }
  .zoom button:hover{background:#383842;color:var(--text)}
  .zoom span{min-width:38px;text-align:center;color:var(--text-dim);font-size:11px}

  /* ---------- 主体 ---------- */
  .body{display:flex;flex:1;overflow:hidden}

  aside{background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
  .left{width:236px;flex:0 0 236px;border-right:1px solid var(--line)}
  .right{width:288px;flex:0 0 288px;border-left:1px solid var(--line)}

  .ptitle{
    height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;background:var(--chrome-2);border-bottom:1px solid var(--line-soft);
    font-size:11px;color:var(--text-faint);letter-spacing:.6px;text-transform:uppercase;
  }
  .ptitle .act{cursor:pointer;color:var(--text-dim);font-size:13px;text-transform:none;letter-spacing:0}
  .ptitle .act:hover{color:var(--text)}
  /* 头部上的小按钮（＋ 添加属性） */
  .ptitle .act.btn{
    border:1px solid var(--line);background:#24242d;color:var(--text-dim);
    border-radius:4px;padding:1px 8px;font-size:11px;letter-spacing:0;line-height:1.5;
  }
  .ptitle .act.btn:hover{border-color:var(--accent-soft);color:var(--text);background:#2e2e3a}

  .scroll{overflow-y:auto;flex:1}
  .scroll::-webkit-scrollbar{width:9px}
  .scroll::-webkit-scrollbar-thumb{background:#383842;border-radius:5px}
  .scroll::-webkit-scrollbar-track{background:transparent}

  /* 树列表 */
  .tree-item{
    padding:7px 10px 7px 22px;cursor:pointer;position:relative;
    border-bottom:1px solid var(--line-soft);font-size:12.5px;
    display:flex;align-items:center;gap:7px;
  }
  .tree-item:hover{background:#26262e}
  .tree-item.sel{background:#2e2e3a}
  .tree-item.sel::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);
  }
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .tree-item .cnt{margin-left:auto;color:var(--text-faint);font-size:11px}

  /* 黑板 —— 树列表固定高度，黑板吃掉左栏剩余空间，不会被挤没 */
  .bb-sec{
    border-top:1px solid var(--line);display:flex;flex-direction:column;
    flex:1 1 auto;min-height:216px;overflow:hidden;background:#1b1b22;
  }
  .bb-empty{
    margin:8px;padding:9px 10px;border:1px dashed #47474f;border-radius:6px;
    color:var(--text-faint);font-size:11.5px;line-height:1.6;background:#1e1e26;
  }
  .bb-empty b{display:block;color:var(--text-dim);font-size:12px;margin-bottom:3px}
  .attr{
    display:flex;align-items:center;gap:8px;padding:6px 10px;
    border-bottom:1px solid var(--line-soft);font-size:12.5px;
  }
  .attr:hover{background:#26262e}
  .attr .key{
    font-family:Consolas,monospace;font-size:11px;color:var(--accent);
    background:#2a2a38;padding:1px 5px;border-radius:3px;flex:0 0 auto;
  }
  .attr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .src{
    font-size:10px;padding:1px 5px;border-radius:3px;flex:0 0 auto;
    border:1px solid var(--line);color:var(--text-faint);
  }
  .src.cfg{color:var(--ok);border-color:#1d5e4a;background:#122b24}
  .src.local{color:var(--warn);border-color:#5c451a;background:#2b2210}
  .attr .refsel{
    flex:1;min-width:0;background:#141419;border:1px solid var(--accent-soft);
    color:var(--text);border-radius:3px;padding:2px 4px;font-size:11px;
  }
  .attr .del{color:var(--text-faint);cursor:pointer;font-size:14px;line-height:1}
  .attr .del:hover{color:var(--err)}
  .addrow{
    display:flex;gap:5px;padding:7px 8px;border-bottom:1px solid var(--line-soft);
    background:#1c1c23;
  }
  .addrow input{
    background:#141419;border:1px solid var(--line);color:var(--text);
    border-radius:4px;padding:3px 6px;font-size:12px;min-width:0;
  }
  .addrow input:focus{outline:none;border-color:var(--accent-soft)}
  .addrow .a1{flex:1}
  .addrow .a2{width:62px}
  .addrow button{
    background:var(--accent-soft);border:0;color:#fff;border-radius:4px;
    padding:0 9px;cursor:pointer;font-size:11.5px;
  }
  .addrow button:hover{background:var(--accent)}
  .hintline{padding:6px 10px;color:var(--text-faint);font-size:11px;line-height:1.5}

  /* ---------- 画布 ---------- */
  .stage{flex:1;position:relative;overflow:hidden;background:var(--canvas)}
  .grid{
    position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:26px 26px;background-position:-1px -1px;opacity:.5;
  }
  .viewport{position:absolute;inset:0;transform-origin:0 0}
  svg.edges{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
  .edge{fill:none;stroke:#6d6d7d;stroke-width:2}
  .edge.hot{stroke:var(--accent);stroke-width:2.6}
  .edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
  .edge-tmp{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;opacity:.9}

  .node{
    position:absolute;width:176px;height:80px;border-radius:7px;cursor:grab;
    background:var(--node);border:1px solid #4d4d59;user-select:none;
    box-shadow:0 2px 5px rgba(0,0,0,.34);
  }
  .node.sel{border-color:#9f9adf;box-shadow:0 0 0 1px var(--accent),0 3px 9px rgba(0,0,0,.45)}
  /* 节点没有分类，所以表头只有一种颜色 —— 差异全写在标题上 */
  .node .head{
    height:20px;border-radius:6px 6px 0 0;display:flex;align-items:center;
    padding:0 8px;font-size:11.5px;color:#e8e8f0;font-weight:500;background:#4d4d59;
  }
  .node .head .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .bdy{padding:6px 9px}
  .node .cost-l{
    font-size:11px;color:#cfcfe0;font-family:Consolas,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .node .cost-l.none{color:var(--text-faint);font-style:italic}
  .node .meta{font-size:10px;color:var(--text-faint);margin-top:5px}
  .port-out{
    position:absolute;left:50%;bottom:-6px;width:11px;height:11px;margin-left:-5.5px;
    border-radius:50%;background:#6d6d7d;border:2px solid #23232a;cursor:crosshair;
  }
  .port-out:hover{background:var(--accent)}
  .node .port-in{
    position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;
    border-radius:50%;background:#4d4d59;
  }

  .stage-hint{
    position:absolute;left:12px;bottom:10px;color:var(--text-faint);
    font-size:11px;pointer-events:none;
  }
  .ctx{
    position:absolute;background:#2b2b34;border:1px solid var(--line);
    border-radius:6px;padding:4px 0;box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:50;display:none;
  }
  .ctx div{
    padding:6px 16px;cursor:pointer;font-size:12.5px;white-space:nowrap;color:var(--text);
  }
  .ctx div:hover{background:var(--accent-soft);color:#fff}
  .ctx hr{border:0;border-top:1px solid var(--line);margin:3px 0}

  /* ---------- Inspector ---------- */
  .insp{padding:9px 11px;overflow-y:auto;flex:1}
  .insp::-webkit-scrollbar{width:9px}
  .insp::-webkit-scrollbar-thumb{background:#383842;border-radius:5px}
  .fld{margin-bottom:10px}
  .fld label{
    display:block;font-size:11px;color:var(--text-faint);margin-bottom:4px;
    text-transform:uppercase;letter-spacing:.5px;
  }
  .fld input,.fld select,.fld textarea{
    width:100%;background:#141419;border:1px solid var(--line);color:var(--text);
    border-radius:4px;padding:5px 7px;font-size:12.5px;font-family:inherit;
  }
  .fld textarea{resize:vertical;min-height:52px;line-height:1.5}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent-soft)}
  .row2{display:flex;gap:8px}
  .row2>div{flex:1}

  /* 本地化 Key：只能选，没有输入框 */
  .keyrow{display:flex;gap:5px;align-items:stretch}
  .keytag{
    flex:1;min-width:0;cursor:pointer;user-select:none;
    background:#141419;border:1px solid var(--line);color:var(--text);
    border-radius:4px;padding:5px 7px;font-size:12px;
    font-family:ui-monospace,Consolas,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .keytag:hover{border-color:var(--accent-soft)}
  .keytag.none{color:var(--warn);border-color:#5c451a;background:#2b2210}
  .keytag.bad{color:var(--err);border-color:#5e1d1d;background:#2b1212}
  .keydel{
    flex:0 0 22px;text-align:center;line-height:26px;cursor:pointer;
    color:var(--text-faint);background:#141419;border:1px solid var(--line);border-radius:4px;
    font-size:14px;
  }
  .keydel:hover{color:var(--err)}
  .keysel{
    width:100%;background:#141419;border:1px solid var(--accent-soft);color:var(--text);
    border-radius:4px;padding:5px 7px;font-size:12px;font-family:ui-monospace,Consolas,monospace;
  }
  .keysel:focus{outline:none}

  .cost-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:11px;color:var(--text-faint);text-transform:uppercase;
    letter-spacing:.5px;margin:14px 0 6px;
  }
  .cost-head .act{color:var(--accent);cursor:pointer;text-transform:none;letter-spacing:0;font-size:12px}
  .cost-head .act:hover{text-decoration:underline}
  .cost-row{display:flex;gap:5px;margin-bottom:5px;align-items:center}
  .cost-row select{flex:1;min-width:0}
  .cost-row input{width:56px;flex:0 0 56px}
  .cost-row .del{
    color:var(--text-faint);cursor:pointer;font-size:14px;line-height:1;flex:0 0 auto;
  }
  .cost-row .del:hover{color:var(--err)}
  .cost-row select,.cost-row input{
    background:#141419;border:1px solid var(--line);color:var(--text);
    border-radius:4px;padding:4px 6px;font-size:12px;
  }
  .cost-row select:focus,.cost-row input:focus{outline:none;border-color:var(--accent-soft)}

  .pre{
    font-size:11.5px;color:var(--text-dim);background:#1a1a20;
    border:1px solid var(--line-soft);border-radius:5px;padding:6px 8px;
    line-height:1.7;
  }
  .pre b{color:#c8c8d4;font-weight:400}
  .empty-note{
    color:var(--text-faint);font-size:12px;padding:14px 4px;line-height:1.7;text-align:center;
  }
  .badge{
    display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;
    background:#2a2a38;color:var(--accent);margin-left:6px;vertical-align:1px;
  }
  .warnbox{
    margin-top:8px;border:1px solid #5c2a28;background:#2a1a1a;border-radius:5px;
    padding:6px 8px;color:#f09595;font-size:11.5px;line-height:1.6;
  }
</style>
</head>
<body>
<div class="app">

  <div class="toolbar">
    <div class="brand">天赋树编辑器<span>Talent Tree · 原型</span></div>
    <button class="tbtn" onclick="addNode()">＋ 节点</button>
    <button class="tbtn" onclick="autoLayout()">自动布局</button>
    <div class="sep"></div>
    <button class="tbtn" onclick="doValidate()">校验</button>
    <button class="tbtn" id="delBtn" onclick="delSel()">删除</button>
    <div class="sep"></div>
    <button class="tbtn primary">保存并导出</button>
    <div class="spacer"></div>
    <div class="zoom">
      <button onclick="zoomBy(-.1)">－</button><span id="ztxt">100%</span><button onclick="zoomBy(.1)">＋</button>
    </div>
  </div>

  <div class="body">

    <!-- 左：树列表 + 黑板 -->
    <aside class="left">
      <div class="ptitle">天赋树<span class="act" onclick="addTree()">＋</span></div>
      <div class="scroll" id="treeList" style="flex:0 0 auto;max-height:180px"></div>

      <div class="bb-sec">
        <div class="ptitle">
          黑板 · 属性<span class="act btn" id="bbAdd">＋ 添加属性</span>
        </div>
        <div class="scroll" id="attrList"></div>
        <div class="hintline">
          属性本身不存数值，只指向<b>配置表行</b>或本地 key；节点消耗引用这里列出的属性。
        </div>
      </div>
    </aside>

    <!-- 中：画布 -->
    <div class="stage" id="stage">
      <div class="grid"></div>
      <div class="viewport" id="vp">
        <svg class="edges" id="edges"></svg>
        <div id="nodes"></div>
      </div>
      <div class="stage-hint">拖动节点移动 · 从底部圆点拖出连线 · 空白处右键添加 · Del 删除选中</div>
      <div class="ctx" id="ctx">
        <div onclick="addNode()">添加节点</div>
        <hr>
        <div onclick="autoLayout()">自动布局</div>
        <div onclick="delSel()">删除选中</div>
      </div>
    </div>

    <!-- 右：Inspector -->
    <aside class="right">
      <div class="ptitle">节点属性</div>
      <div class="insp" id="insp"></div>
    </aside>

  </div>
</div>

<script>
/* ============ 数据 ============ */
/* 节点没有分类字段：天赋节点不需要 Selector/Sequence/Action 那样的功能区分，
   差异只体现在「叫什么名字」和「消耗多少属性」上。 */
const S = {
  trees:[
    {id:1,name:'战士天赋',color:'#7F77DD'},
    {id:2,name:'法师天赋',color:'#378ADD'},
    {id:3,name:'游侠天赋',color:'#1D9E75'}
  ],
  treeId:1,
  attrs:[
    {key:'STR', name:'力量', type:'int', src:'cfg',  ref:'AttrConfig.力量'},
    {key:'VIT', name:'体力', type:'int', src:'cfg',  ref:'AttrConfig.体力'},
    {key:'AGI', name:'敏捷', type:'int', src:'cfg',  ref:'AttrConfig.敏捷'},
    {key:'GOLD',name:'金币', type:'int', src:'local',ref:''}
  ],
  /* 本地化表里已有的 key（真实环境下来自 loc 包，这里只作演示）。
     descLocKey 只能从这里选，不给手填。 */
  locKeys:[
    'Talent/BasicTraining/Name','Talent/BasicTraining/Desc',
    'Talent/StrUp/Name','Talent/StrUp/Desc',
    'Talent/RangerStep/Name','Talent/RangerStep/Desc',
    'Talent/HeavyStrike/Name','Talent/HeavyStrike/Desc',
    'Talent/IronWall/Name','Talent/IronWall/Desc',
    'Talent/Whirlwind/Name','Talent/Whirlwind/Desc'
  ],
  nodes:[
    {id:1,title:'基础训练',x:300,y:16,  maxLv:1, locKey:'Talent/BasicTraining/Desc', costs:[]},
    {id:2,title:'力量强化',x:130,y:150, maxLv:5, locKey:'Talent/StrUp/Desc',        costs:[{key:'STR',v:5}]},
    {id:3,title:'游侠步法',x:452,y:150, maxLv:3, locKey:'Talent/RangerStep/Desc',   costs:[{key:'AGI',v:3}]},
    {id:4,title:'重击',    x:52, y:284, maxLv:3, locKey:'Talent/HeavyStrike/Desc',  costs:[{key:'STR',v:5},{key:'GOLD',v:20}]},
    {id:5,title:'铁壁',    x:420,y:284, maxLv:2, locKey:'Talent/IronWall/Desc',     costs:[{key:'VIT',v:8}]},
    /* 故意留一个拼错的 key：演示"选了但表里查不到 → 标红" */
    {id:6,title:'旋风斩',  x:212,y:418, maxLv:1, locKey:'Talent/Whrilwind/Desc',    costs:[{key:'STR',v:20},{key:'GOLD',v:100}]}
  ],
  edges:[
    {f:1,t:2},{f:1,t:3},{f:2,t:4},{f:3,t:5},{f:2,t:6},{f:5,t:6}
  ]
};

/* 演示用：配置表里可被绑定的行（真实实现 = ConfigRowRef{TypeName, Id}） */
const CFG_ROWS=['AttrConfig.力量','AttrConfig.体力','AttrConfig.敏捷','ItemConfig.金币','ItemConfig.技能点'];

let selNode=null, selEdge=null, nextId=7;
let zoom=1, panX=28, panY=18;

/* ============ 渲染 ============ */
const NW=176, NH=80;

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

function render(){
  renderTrees(); renderBlackboard(); renderGraph(); renderInspector();
}

function renderTrees(){
  const box=document.getElementById('treeList'); box.innerHTML='';
  S.trees.forEach(t=>{
    const n=S.nodes.length;
    const d=el('div','tree-item'+(S.treeId===t.id?' sel':''));
    d.innerHTML=`<i class="dot" style="background:${t.color}"></i><span>${t.name}</span>
                 <span class="cnt">${S.treeId===t.id?n+' 节点':''}</span>`;
    d.onclick=()=>{S.treeId=t.id;render();};
    box.appendChild(d);
  });
}

function renderBlackboard(){
  const box=document.getElementById('attrList'); box.innerHTML='';
  if(!S.attrs.length){
    box.innerHTML=`<div class="bb-empty">
      <b>黑板是空的</b>
      节点只能消耗在这里登记过的属性。<br>
      点右上角「＋ 添加属性」，属性来源可以是<b>配置表行</b>或本地 key。
    </div>`;
    return;
  }
  S.attrs.forEach((a,i)=>{
    const d=el('div','attr');
    d.innerHTML=`<span class="key">${a.key}</span>
                 <span class="nm">${a.name}</span>
                 <span class="src ${a.src==='cfg'?'cfg':'local'}">${a.src==='cfg'?'配置表':'未绑定'}</span>
                 <span class="del">×</span>`;
    if(a.src==='cfg')d.title='绑定：'+a.ref;

    /* 点来源标签 → 就地换成下拉，选一条配置行即完成绑定 */
    const tag=d.querySelector('.src');
    tag.style.cursor='pointer';
    tag.onclick=e=>{
      e.stopPropagation();
      const sel=el('select','refsel');
      sel.innerHTML=`<option value="">— 本地 key（不绑行）—</option>`+
        CFG_ROWS.map(r=>`<option value="${r}" ${r===a.ref?'selected':''}>${r}</option>`).join('');
      tag.replaceWith(sel); sel.focus();
      const commit=()=>{
        if(sel.value){a.src='cfg';a.ref=sel.value;}else{a.src='local';a.ref='';}
        render();
      };
      sel.onchange=commit; sel.onblur=commit;
    };

    d.querySelector('.del').onclick=e=>{
      e.stopPropagation();
      if(confirm(`删除属性 ${a.name}？已引用它的节点会变成无效消耗。`)){S.attrs.splice(i,1);render();}
    };
    box.appendChild(d);
  });
}

function renderGraph(){
  const vpH=document.getElementById('vp'), nl=document.getElementById('nodes'), sv=document.getElementById('edges');
  vpH.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  nl.innerHTML=''; sv.innerHTML='';

  S.edges.forEach((e,i)=>{
    const a=S.nodes.find(n=>n.id===e.f), b=S.nodes.find(n=>n.id===e.t);
    if(!a||!b)return;
    const p=el('path','edge'+(selEdge===i?' hot':''));
    p.setAttribute('d',bezier(a,b));
    const hit=el('path','edge-hit'); hit.setAttribute('d',bezier(a,b));
    hit.onclick=ev=>{ev.stopPropagation();selEdge=i;selNode=null;render();};
    sv.appendChild(p); sv.appendChild(hit);
  });

  S.nodes.forEach(n=>{
    const d=el('div','node'+(selNode===n.id?' sel':''));
    d.style.left=n.x+'px'; d.style.top=n.y+'px';
    const costTxt=n.costs.map(c=>`${c.key} ${c.v}`).join('　');
    d.innerHTML=`
      <div class="head"><span class="ttl">${n.title}</span></div>
      <div class="bdy">
        <div class="cost-l${costTxt?'':' none'}">${costTxt||'无消耗'}</div>
        ${n.maxLv>1?`<div class="meta">每级 · 最高 ${n.maxLv} 级</div>`:''}
      </div>
      <div class="port-in"></div>
      <div class="port-out"></div>`;
    d.querySelector('.port-out').addEventListener('mousedown',ev=>startLink(ev,n.id));
    d.addEventListener('mousedown',ev=>{if(ev.target.classList.contains('port-out'))return;startDrag(ev,n)});
    nl.appendChild(d);
  });

  document.getElementById('ztxt').textContent=Math.round(zoom*100)+'%';
}

function bezier(a,b){
  const x1=a.x+NW/2, y1=a.y+NH, x2=b.x+NW/2, y2=b.y;
  const dy=Math.max(30,Math.abs(y2-y1)*.5);
  return `M${x1},${y1} C${x1},${y1+dy} ${x2},${y2-dy} ${x2},${y2}`;
}

/* ============ Inspector ============ */
function renderInspector(){
  const box=document.getElementById('insp');
  const n=S.nodes.find(x=>x.id===selNode);
  if(!n){
    box.innerHTML=`<div class="empty-note">未选中节点<br><br>在画布上点击一个节点查看它的消耗、等级与前置。</div>`;
    return;
  }
  const pre=S.edges.filter(e=>e.t===n.id).map(e=>S.nodes.find(x=>x.id===e.f))
                   .filter(Boolean).map(x=>x.title).join('、')||'无';
  const nxt=S.edges.filter(e=>e.f===n.id).map(e=>S.nodes.find(x=>x.id===e.t))
                   .filter(Boolean).map(x=>x.title).join('、')||'无';

  let html=`
    <div class="fld"><label>名称</label><input id="i_title" value="${n.title}"></div>
    <div class="fld"><label>本地化 Key（只能选）</label>
      <div class="keyrow">
        <span class="keytag ${n.locKey?(S.locKeys.includes(n.locKey)?'ok':'bad'):'none'}"
              id="i_lockey">${n.locKey||'选择 Key →'}</span>
        <span class="keydel" id="i_lockey_clr" ${n.locKey?'':'style="visibility:hidden"'}>×</span>
      </div>
    </div>
    <div class="row2 fld">
      <div><label>最高等级</label><input id="i_lv" type="number" min="1" value="${n.maxLv}"></div>
      <div><label>节点 ID</label><input value="${n.id}" disabled style="color:#666"></div>
    </div>

    <div class="cost-head"><span>消耗（黑板属性）</span><span class="act" id="costAdd">＋ 添加</span></div>
    <div id="costList"></div>

    <div class="cost-head"><span>连线关系</span></div>
    <div class="pre"><b>前置：</b>${pre}<br><b>后继：</b>${nxt}</div>
  `;
  box.innerHTML=html;

  const bind=(id,fn)=>{const e=document.getElementById(id);e.addEventListener('input',()=>fn(e.value));};
  bind('i_title',v=>{n.title=v;renderGraph();renderTrees();});
  bind('i_lv',v=>{n.maxLv=Math.max(1,parseInt(v||1));renderGraph();});

  /* 本地化 Key：点开 = 列出现有 key 让你挑（没有输入框，手填不了）。
     真实编辑器复用 LocKeyPickerWindow（折叠多级菜单 + 「搜索 key…」），这里用下拉等价演示。 */
  const keyTag=document.getElementById('i_lockey');
  if(keyTag)keyTag.onclick=()=>{
    const wrap=keyTag.parentElement;
    const sel=el('select','keysel');
    sel.innerHTML=`<option value="">（不放 key）</option>`+
      S.locKeys.map(k=>`<option value="${k}" ${k===n.locKey?'selected':''}>${k}</option>`).join('');
    wrap.replaceChild(sel,keyTag);
    sel.focus();
    sel.onchange=()=>{n.locKey=sel.value;renderInspector();};
    sel.onblur=()=>renderInspector();
  };
  const clr=document.getElementById('i_lockey_clr');
  if(clr)clr.onclick=()=>{n.locKey='';renderInspector();};
  document.getElementById('costAdd').onclick=()=>{
    if(!S.attrs.length)return alert('先在黑板里添加属性');
    n.costs.push({key:S.attrs[0].key,v:1}); render();
  };
  renderCosts(n);
}

function renderCosts(n){
  const box=document.getElementById('costList'); if(!box)return;
  box.innerHTML='';
  n.costs.forEach((c,i)=>{
    const row=el('div','cost-row');
    row.innerHTML=`<select>${S.attrs.map(a=>
        `<option value="${a.key}" ${a.key===c.key?'selected':''}>${a.name} · ${a.key}</option>`).join('')}
      </select>
      <input type="number" value="${c.v}">
      <span class="del">×</span>`;
    row.querySelector('select').addEventListener('change',e=>{c.key=e.target.value;renderGraph();renderInspector();});
    row.querySelector('input').addEventListener('input',e=>{c.v=parseFloat(e.target.value||0);renderGraph();});
    row.querySelector('.del').onclick=()=>{n.costs.splice(i,1);render();};
    box.appendChild(row);
  });
  if(!n.costs.length)box.innerHTML=`<div class="hintline" style="padding:2px 0">无消耗</div>`;
}

/* ============ 交互 ============ */
function addNode(){
  const st=document.getElementById('stage').getBoundingClientRect();
  const x=(st.width/2-panX)/zoom-NW/2+(Math.random()*70-35);
  const y=(st.height/2-panY)/zoom-NH/2+(Math.random()*70-35);
  const id=nextId++;
  S.nodes.push({id,title:'新节点',x:Math.round(x),y:Math.round(y),maxLv:1,locKey:'',costs:[]});
  selNode=id; hideCtx(); render();
}
function addTree(){
  const nm=prompt('新天赋树名称：','新天赋树'); if(!nm)return;
  const id=Math.max(...S.trees.map(t=>t.id))+1;
  S.trees.push({id,name:nm,color:'#888780'}); S.treeId=id; render();
}
function delSel(){
  if(selNode!=null){
    S.nodes=S.nodes.filter(x=>x.id!==selNode);
    S.edges=S.edges.filter(e=>e.f!==selNode&&e.t!==selNode);
    selNode=null;
  }else if(selEdge!=null){S.edges.splice(selEdge,1);selEdge=null;}
  render();
}

/* 拖动节点 */
let drag=null;
function startDrag(ev,n){
  if(ev.button!==0)return;
  ev.stopPropagation(); selNode=n.id; selEdge=null; render();
  drag={id:n.id,ox:ev.clientX/zoom-n.x,oy:ev.clientY/zoom-n.y};
  window.addEventListener('mousemove',onDrag);
  window.addEventListener('mouseup',endDrag);
}
function onDrag(e){
  if(!drag)return;
  const n=S.nodes.find(x=>x.id===drag.id); if(!n)return;
  n.x=Math.round(e.clientX/zoom-drag.ox); n.y=Math.round(e.clientY/zoom-drag.oy);
  renderGraph();
}
function endDrag(){drag=null;window.removeEventListener('mousemove',onDrag);window.removeEventListener('mouseup',endDrag);}

/* 连线 */
let linking=null, tmpPath=null;
function startLink(ev,fromId){
  ev.stopPropagation(); ev.preventDefault();
  linking={from:fromId};
  const sv=document.getElementById('edges');
  tmpPath=document.createElementNS('http://www.w3.org/2000/svg','path');
  tmpPath.setAttribute('class','edge-tmp'); sv.appendChild(tmpPath);
  window.addEventListener('mousemove',onLink);
  window.addEventListener('mouseup',endLink);
}
function screenToWorld(e){
  const st=document.getElementById('stage').getBoundingClientRect();
  return {x:(e.clientX-st.left-panX)/zoom,y:(e.clientY-st.top-panY)/zoom};
}
function onLink(e){
  if(!linking)return;
  const a=S.nodes.find(n=>n.id===linking.from), p=screenToWorld(e);
  tmpPath.setAttribute('d',`M${a.x+NW/2},${a.y+NH} C${a.x+NW/2},${a.y+NH+40} ${p.x},${p.y-40} ${p.x},${p.y}`);
}
function endLink(e){
  window.removeEventListener('mousemove',onLink); window.removeEventListener('mouseup',endLink);
  if(tmpPath)tmpPath.remove(); tmpPath=null;
  const p=screenToWorld(e);
  const target=S.nodes.find(n=>p.x>=n.x&&p.x<=n.x+NW&&p.y>=n.y&&p.y<=n.y+NH);
  if(target&&target.id!==linking.from){
    const dup=S.edges.some(x=>x.f===linking.from&&x.t===target.id);
    if(dup){alert('这条连线已存在');}
    else if(createsCycle(linking.from,target.id)){alert('不允许出现环：天赋树必须是有向无环图');}
    else{S.edges.push({f:linking.from,t:target.id});}
  }
  linking=null; render();
}
function createsCycle(from,to){
  const seen=new Set([to]); const stack=[to];
  while(stack.length){
    const cur=stack.pop();
    if(cur===from)return true;
    S.edges.filter(e=>e.f===cur).forEach(e=>{if(!seen.has(e.t)){seen.add(e.t);stack.push(e.t);}});
  }
  return false;
}

/* 画布平移 / 选中空白 */
const stage=document.getElementById('stage');
stage.addEventListener('mousedown',ev=>{
  if(ev.button===2)return;
  if(ev.target.closest('.node')||ev.target.closest('.ctx'))return;
  selNode=null; selEdge=null; render();
  const sx=ev.clientX-panX, sy=ev.clientY-panY;
  const mv=e=>{panX=e.clientX-sx;panY=e.clientY-sy;
    document.getElementById('vp').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;}
  const up=()=>{window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);}
  window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up);
});

/* 右键菜单 */
const ctx=document.getElementById('ctx');
stage.addEventListener('contextmenu',ev=>{
  ev.preventDefault();
  // ctx 是 absolute，定位基准是 .stage，必须用相对坐标而不是 clientX
  const r=stage.getBoundingClientRect();
  ctx.style.display='block';
  ctx.style.left=Math.min(ev.clientX-r.left,r.width-158)+'px';
  ctx.style.top=Math.max(0,ev.clientY-r.top-4)+'px';
});
window.addEventListener('mousedown',e=>{if(!e.target.closest('.ctx'))hideCtx();});
function hideCtx(){ctx.style.display='none';}

/* 缩放 */
function zoomBy(d){zoom=Math.min(2,Math.max(.4,+(zoom+d).toFixed(2)));
  document.getElementById('vp').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  document.getElementById('ztxt').textContent=Math.round(zoom*100)+'%';}
stage.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY>0?-.08:.08);},{passive:false});

/* 删除键 */
window.addEventListener('keydown',e=>{
  // 输入框里打字时不要触发删节点
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(e.key==='Escape'){selNode=null;selEdge=null;render();hideCtx();return;}
  if(e.key==='Delete'){e.preventDefault();delSel();}
});

/* 自动布局 */
function autoLayout(){
  // BFS 求每个节点的最长路径深度，再按层横向铺开
  const depth={};
  S.nodes.forEach(n=>{depth[n.id]=0;});
  const roots=S.nodes.filter(n=>!S.edges.some(e=>e.t===n.id));
  const queue=roots.map(r=>r.id), seen=new Set();
  while(queue.length){
    const cur=queue.shift();
    if(seen.has(cur))continue;
    seen.add(cur);
    S.edges.filter(e=>e.f===cur).forEach(e=>{
      depth[e.t]=Math.max(depth[e.t]||0,(depth[cur]||0)+1);
      queue.push(e.t);
    });
  }
  const layers={};
  S.nodes.forEach(n=>{const d=depth[n.id]||0;(layers[d]=layers[d]||[]).push(n);});
  Object.keys(layers).forEach(k=>{
    layers[k].forEach((n,i)=>{
      n.y=30+(+k)*150;
      n.x=40+i*(NW+36);
    });
  });
  render();
}

/* 校验 */
function doValidate(){
  const msgs=[];
  /* 不校验「起点数量」：节点没有分类，多入口是合法的 */
  S.nodes.forEach(n=>{
    const hasIn=S.edges.some(e=>e.t===n.id), hasOut=S.edges.some(e=>e.f===n.id);
    if(!hasIn&&!hasOut)msgs.push(`「${n.title}」完全孤立：既无前置也无后继`);
    n.costs.forEach(c=>{if(!S.attrs.some(a=>a.key===c.key))msgs.push(`「${n.title}」消耗了黑板里不存在的属性 ${c.key}`);});
  });
  S.attrs.forEach(a=>{
    if(!S.nodes.some(n=>n.costs.some(c=>c.key===a.key)))msgs.push(`黑板属性 ${a.name} 未被任何节点使用`);
  });
  if(!msgs.length){alert('校验通过：无问题');return;}
  const box=document.getElementById('insp');
  box.innerHTML=`<div class="cost-head"><span>校验结果 · ${msgs.length} 条</span></div>
    <div class="warnbox">${msgs.map(m=>'· '+m).join('<br>')}</div>`+
    (selNode!=null?`<div class="hintline">重新点击节点可返回属性编辑</div>`:'');
}

/* 黑板添加 */
document.getElementById('bbAdd').onclick=()=>{
  const list=document.getElementById('attrList');
  if(document.getElementById('newAttr'))return;
  const row=el('div','addrow'); row.id='newAttr';
  const old=list.querySelector('.bb-empty'); if(old)old.remove();
  row.innerHTML=`<input class="a1" placeholder="名称" id="na_name">
                 <input class="a2" placeholder="KEY" id="na_key">
                 <button id="na_ok">加</button>`;
  list.prepend(row);
  const nm=document.getElementById('na_name'), ky=document.getElementById('na_key');
  nm.focus();
  const done=()=>{
    if(!nm.value.trim()){row.remove();return;}
    S.attrs.push({key:(ky.value.trim()||nm.value.trim()).toUpperCase(),name:nm.value.trim(),type:'int',src:'local',ref:''});
    render();
  };
  document.getElementById('na_ok').onclick=done;
  row.addEventListener('keydown',e=>{if(e.key==='Enter')done();if(e.key==='Escape')row.remove();});
};

render();
</script>
